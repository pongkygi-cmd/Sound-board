<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a0a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Soundboard</title>
<meta name="description" content="A mobile-first soundboard with unlimited uploads, trimming and portable profiles.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{--bg1:#0a0a12;--bg2:#1a2f5c;--card:#14141c;--line:#1f3a6e;--blue:#3b82f6;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--txt:#fff;--mut:#9aa4b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg1);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{background:linear-gradient(180deg,#0a0a12 0%,#111428 45%,#1a2f5c 100%) fixed;min-height:100%}
#app{max-width:560px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 18px 130px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 0 22px}
.icon-btn{width:44px;height:44px;color:var(--blue);font-size:28px;display:grid;place-items:center}
.pill{display:flex;align-items:center;gap:10px;padding:10px 20px;border-radius:14px;background:#0f1630;border:1px solid var(--line);font-weight:700;font-size:20px}
.pill svg{font-size:22px;color:var(--blue)}
.edit-btn{padding:12px 26px;border-radius:14px;border:2px solid var(--blue);color:var(--blue);font-weight:700;font-size:20px}
.edit-btn.done{background:var(--blue);color:#fff;border-color:#7c8cff}
#boards{display:flex;gap:14px;align-items:center;overflow-x:auto;padding:4px 2px 18px;scrollbar-width:none}
#boards::-webkit-scrollbar{display:none}
.add-board{flex:none;width:58px;height:58px;border-radius:50%;background:#14172b;border:1px solid #22284a;display:grid;place-items:center}
.add-board span{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:24px;color:#0a0a12}
.add-board svg{stroke-width:3}
.tab{flex:none;display:flex;align-items:center;gap:10px;padding:14px 22px;border-radius:30px;background:#1f2a4a;color:#cfd8ee;font-weight:600;font-size:20px;white-space:nowrap}
.tab.on{background:var(--blue);color:#fff}
.tab .mini{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
.tab .mini.e{background:#fff;color:var(--blue)}.tab .mini.d{background:var(--red);color:#fff}
#grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pad{position:relative;aspect-ratio:1/1;border-radius:26px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px;border:2px solid rgba(255,255,255,.25);user-select:none;-webkit-user-select:none;touch-action:manipulation;transition:transform .08s,filter .2s}
.pad:active{transform:scale(.97)}
.pad .nm{font-weight:700;font-size:22px;line-height:1.15;word-break:break-word;max-height:2.4em;overflow:hidden}
.pad .du{font-size:17px;opacity:.7;margin-top:6px}
.pad .tools{position:absolute;top:10px;right:10px;display:flex;gap:2px;background:rgba(0,0,0,.2);border-radius:12px;padding:4px 6px}
.pad .tools button{width:30px;height:32px;font-size:18px;opacity:.55;display:grid;place-items:center;border-radius:8px}
.pad .tools button.on{opacity:1;background:rgba(255,255,255,.28)}
.pad .prog{position:absolute;left:0;bottom:0;height:7px;width:0;background:rgba(255,255,255,.85)}
.pad.playing{box-shadow:0 0 0 3px #fff,0 0 28px rgba(255,255,255,.35) inset}
.pad.editing{filter:brightness(.42) saturate(.9)}
.pad .acts{position:absolute;bottom:10px;left:0;right:0;display:none;justify-content:center;gap:24px}
.editmode .pad .acts{display:flex}
.acts button{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-size:30px;filter:none}
.acts .ed{background:var(--blue)}.acts .rm{background:var(--red)}
.editmode .pad{filter:brightness(.55)}
.editmode .pad .acts{filter:brightness(1.8)}
.slot{aspect-ratio:1/1;border-radius:26px;border:2px dashed #29467d;opacity:.8;display:grid;place-items:center;color:#29467d;font-size:36px}
.fab{position:fixed;right:max(22px,calc(50% - 258px));bottom:calc(26px + env(safe-area-inset-bottom));width:128px;height:128px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:56px;box-shadow:0 12px 30px rgba(59,130,246,.45);z-index:5}
.fab{width:78px;height:78px;font-size:42px}
.fab svg{stroke-width:2.4}
/* overlays */
#ov{position:fixed;inset:0;background:rgba(0,0,0,.62);display:none;z-index:20;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
#ov.center{align-items:center;padding:20px}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:#0b0b12;border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));border:1px solid #1a2140;border-bottom:0}
#ov.center .sheet{border-radius:28px;border-bottom:1px solid #1a2140;max-height:86vh}
.grab{width:46px;height:6px;border-radius:3px;background:var(--blue);margin:0 auto 14px}
.sh-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px}
.sh-title{display:flex;gap:10px;align-items:center;font-weight:700;font-size:20px;padding:10px 18px;border-radius:14px;background:#0f1630;border:1px solid var(--line)}
.sh-title svg{color:var(--blue)}
.x{width:46px;height:46px;border-radius:50%;background:#10152a;display:grid;place-items:center;font-size:22px}
.opt{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:16px;border-radius:20px;border:1px solid #1e3a78;background:#0c0c14;margin-top:14px}
.opt .ic{width:54px;height:54px;border-radius:16px;background:#14213f;color:var(--blue);display:grid;place-items:center;font-size:28px;flex:none}
.opt b{display:block;font-size:20px}.opt small{color:var(--mut);font-size:15px}
.opt .ch{margin-left:auto;color:var(--blue);font-size:22px}
.search{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:#0c0c14;margin-bottom:14px}
.search svg{color:var(--mut);font-size:24px}
.search input{flex:1;background:none;border:0;outline:0;color:#fff;font:inherit;font-size:19px;min-width:0}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.chip{padding:12px 6px;border-radius:14px;border:1px solid;font-weight:700;font-size:16px;text-align:center;background:#0c0c14;white-space:nowrap}
.chip.on{background:var(--c);color:#fff;border-color:var(--c)}
.srow{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;border:1px solid #6b3a12;background:#101015;margin-bottom:12px}
.srow .pl{width:56px;height:56px;border-radius:50%;background:#2a1b14;color:var(--orange);display:grid;place-items:center;font-size:24px;flex:none}
.srow .pl.on{background:var(--orange);color:#000}
.srow .mid{flex:1;min-width:0}.srow .mid b{display:block;font-size:20px}
.srow .mid small{color:#f97316;font-size:15px}
.srow .st{font-size:28px;color:#8a8a96;width:40px;height:40px;display:grid;place-items:center}
.srow .st.on{color:#fbbf24}.srow .st.on svg{fill:#fbbf24}
.srow .add{width:60px;height:56px;border-radius:14px;background:#f97316;color:#fff;display:grid;place-items:center;font-size:30px;flex:none}
.srow .add.ok{background:#16a34a}
.card{background:#16161d;border:1px solid #23232e;border-radius:22px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:14px}
.row .ic{width:52px;height:52px;border-radius:50%;background:#1c2338;color:var(--blue);display:grid;place-items:center;font-size:24px;flex:none}
.row b{display:block;font-size:20px}.row small{color:var(--mut);font-size:15px}
.row .ch{margin-left:auto;color:var(--mut);font-size:22px}
.btnrow{width:100%;text-align:left;margin-bottom:12px;padding:16px;background:#16161d;border:1px solid #23232e;border-radius:20px}
.slbox{background:#202027;border-radius:16px;padding:14px 16px;margin-top:12px}
.slbox .lb{display:flex;justify-content:space-between;font-size:18px;margin-bottom:8px}.slbox .lb i{font-style:normal;color:var(--blue);font-weight:700}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:5px;background:#2a3b66;outline:0;margin:10px 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:44px;height:30px;border-radius:15px;background:var(--blue);border:0}
input[type=range]::-moz-range-thumb{width:44px;height:30px;border-radius:15px;background:var(--blue);border:0}
.txt{width:100%;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#0c0c14;color:#fff;font:inherit;font-size:19px;outline:0}
select.txt{appearance:none}
.sw{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 4px}
.sw button{width:42px;height:42px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:#fff}
.lbl{font-size:15px;color:var(--mut);margin:16px 0 4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.tg{display:flex;gap:10px}
.tg button{flex:1;padding:14px 4px;border-radius:14px;border:1px solid #2a3b66;background:#0c0c14;font-weight:600;font-size:16px;display:flex;flex-direction:column;align-items:center;gap:4px}
.tg button svg{font-size:22px}
.tg button.on{background:var(--blue);border-color:var(--blue)}
.pbtn{padding:15px 22px;border-radius:16px;font-weight:700;font-size:18px;background:var(--blue);color:#fff}
.pbtn.sec{background:#1f2a4a}.pbtn.dng{background:var(--red)}
.btns{display:flex;gap:12px;margin-top:20px}.btns .pbtn{flex:1}
.hint{color:var(--mut);font-size:14px;line-height:1.4;margin:6px 2px}
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:#1f2a4a;padding:12px 20px;border-radius:14px;font-weight:600;z-index:40;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
.toast.show{opacity:1}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:30px 10px;font-size:18px}
</style>
</head>

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem('sb_state'));if(s&&s.boards)return s}catch(e){}
 return {boards:[{id:uid(),name:'Board 1',pads:[]}],active:null,fade:3,lang:'system',fav:[]}}
if(!S.active||!S.boards.find(b=>b.id===S.active))S.active=S.boards[0].id;
const save=()=>{S.ts=Date.now();let ok=false;try{localStorage.setItem('sb_state',JSON.stringify(S));ok=true}catch(e){}cloudSave();kvPut(S).catch(()=>{if(!ok&&!cloud)warnStorage()})};
let _kv;
function kvDb(){return _kv||(_kv=new Promise((res,rej)=>{const r=indexedDB.open('sb_meta',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function kvPut(v){const d=await kvDb();return new Promise((res,rej)=>{const tx=d.transaction('kv','readwrite');tx.objectStore('kv').put(JSON.parse(JSON.stringify(v)),'state');tx.oncomplete=res;tx.onerror=tx.onabort=()=>rej(tx.error)})}
async function kvGet(){const d=await kvDb();return new Promise((res,rej)=>{const r=d.transaction('kv','readonly').objectStore('kv').get('state');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}

$('#profIn').onchange=async e=>{const f=e.target.files[0];if(!f)return;let j;try{j=JSON.parse(await f.text());if(j.app!=='soundboard'||!j.state)throw 0}catch(err){toast('Invalid profile');return}
 closeSheet();
 const s=openSheet('<h3 style="margin:6px 0 8px;font-size:22px">'+t('importQ')+'</h3><p class="hint" style="font-size:16px">'+t('importD')+'</p><div class="btns"><button class="pbtn sec" id="mM">'+t('merge')+'</button><button class="pbtn" id="mR">'+t('replace')+'</button></div><div class="btns" style="margin-top:10px"><button class="pbtn sec" data-close="1">'+t('cancel')+'</button></div>',{center:true});
 const go=async mode=>{ovClose=null;closeSheet();stopAll();
  for(const x of j.files||[]){const r=await fetch(x.data);const blob=await r.blob();await idbPut({id:x.id,name:x.name,type:x.type,data:await blob.arrayBuffer()});cache.delete('file:'+x.id)}
  if(mode==='replace'){S=Object.assign({fade:3,lang:'system',fav:[]},j.state);if(!S.boards.length)S.boards=[{id:uid(),name:'Board 1',pads:[]}];if(!S.boards.find(b=>b.id===S.active))S.active=S.boards[0].id}
  else{j.state.boards.forEach(b=>{b.id=uid();S.boards.push(b)});S.fav=[...new Set([...S.fav,...(j.state.fav||[])])]}
  (j.files||[]).forEach(x=>{if(S.assets)delete S.assets[x.id]});
  save();render();toast(t('imported'));pushMissing()};
 s.querySelector('#mR').onclick=()=>go('replace');s.querySelector('#mM').onclick=()=>go('merge')};
/* ---------- events ---------- */
$('#btnSettings').onclick=settingsSheet;
$('#btnStop').onclick=stopAll;
$('#btnEdit').onclick=()=>{editMode=!editMode;render()};
$('#fab').onclick=addSheet;
$('#boards').onclick=async e=>{
 if(e.target.closest('#addBoard')){const n=await promptName(t('newBoard'),'Board '+(S.boards.length+1));if(n){const b={id:uid(),name:n,pads:[]};S.boards.push(b);S.active=b.id;save();render()}return}
 if(e.target.closest('[data-ren]')){const b=board();const n=await promptName(t('rename'),b.name);if(n){b.name=n;save();render()}return}
 if(e.target.closest('[data-delb]')){if(S.boards.length<2){toast('At least one board required');return}if(await ask(t('delBoard'),board().name,t('delete'),true)){stopAll();S.boards=S.boards.filter(x=>x.id!==S.active);S.active=S.boards[0].id;save();gcSounds();render()}return}
 const tab=e.target.closest('[data-b]');if(tab&&tab.dataset.b!==S.active){S.active=tab.dataset.b;save();render()}};
$('#grid').onclick=e=>{
 if(e.target.closest('[data-add]')){addSheet();return}
 const el=e.target.closest('.pad');if(!el)return;const id=el.dataset.id;const p=board().pads.find(x=>x.id===id);
 const tg=e.target.closest('[data-tg]');
 if(tg){const k=tg.dataset.tg;p[k]=!p[k];save();render(true);const a=active.get(id);if(k==='loop'&&a&&!a.pending){try{a.src.loop=p.loop;if(p.loop){const bf=cache.get(skey(p.sound));const si=segInfo(p,bf.duration);a.src.loopStart=si.st;a.src.loopEnd=si.en;a.loop=true}}catch(x){}}return}
 if(e.target.closest('[data-ed]')){editPad(id);return}
 if(e.target.closest('[data-rm]')){removePad(id);return}
 if(editMode){if(e.target.closest('.nm')||e.target.closest('.du')){promptName(t('renameSound'),p.name).then(n=>{if(n){p.name=n;save();render(true)}})}return}
 togglePad(p)};
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('show'))closeSheet()});
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
(async()=>{let ok=false;try{localStorage.setItem('sb_t','1');localStorage.removeItem('sb_t');ok=true}catch(e){}
 try{const v=await kvGet();ok=true;
  if(v&&v.boards&&v.boards.length&&(v.ts||0)>(S.ts||0)){S=Object.assign({fade:3,lang:'system',fav:[]},v);if(!S.boards.find(b=>b.id===S.active))S.active=S.boards[0].id;render()}
  else await kvPut(S)}catch(e){}
 await initCloud();if(!ok&&!cloud)warnStorage()})();
</script>
